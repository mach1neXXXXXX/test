<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>OPPO 应用商店跳转测试 | 创物岛</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #18201c;
            --muted: #65706a;
            --line: #dfe5e1;
            --primary: #087f5b;
            --primary-hover: #066548;
            --soft-green: #e8f6f0;
            --amber: #a05a00;
            --soft-amber: #fff4df;
            --blue: #225ea8;
            --soft-blue: #eaf2fb;
            --shadow: 0 8px 24px rgba(25, 45, 35, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--text);
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        button,
        a {
            font: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
        }

        .topbar-inner,
        main {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar-inner {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            flex: 0 0 34px;
            border-radius: 6px;
            color: #ffffff;
            background: var(--primary);
            font-size: 11px;
            font-weight: 800;
        }

        .brand strong {
            display: block;
            font-size: 16px;
        }

        .brand span {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 9px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        main {
            padding: 32px 0 56px;
        }

        .page-heading {
            margin-bottom: 24px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.3;
        }

        .page-heading p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .environment {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-bottom: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .environment-item {
            min-width: 0;
            padding: 16px 18px;
        }

        .environment-item + .environment-item {
            border-left: 1px solid var(--line);
        }

        .environment-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .environment-value {
            display: block;
            overflow-wrap: anywhere;
            font-size: 14px;
            line-height: 1.5;
        }

        .detected {
            color: var(--primary);
            font-weight: 700;
        }

        .not-detected {
            color: var(--amber);
            font-weight: 700;
        }

        .section-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 18px;
        }

        .section-heading span {
            color: var(--muted);
            font-size: 12px;
        }

        .method-list {
            display: grid;
            gap: 10px;
        }

        .method {
            display: grid;
            grid-template-columns: 44px minmax(150px, 0.65fr) minmax(260px, 1.6fr) auto;
            align-items: center;
            gap: 14px;
            min-height: 92px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .method-index {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            color: var(--primary);
            background: var(--soft-green);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .method-title {
            min-width: 0;
        }

        .method-title strong {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 2px 7px;
            border-radius: 4px;
            color: var(--blue);
            background: var(--soft-blue);
            font-size: 11px;
            font-weight: 700;
        }

        .tag.official {
            color: var(--primary);
            background: var(--soft-green);
        }

        .tag.legacy,
        .tag.download {
            color: var(--amber);
            background: var(--soft-amber);
        }

        .scheme {
            margin: 0;
            padding: 10px 12px;
            overflow-wrap: anywhere;
            border: 1px solid #e8ece9;
            border-radius: 6px;
            color: #37413c;
            background: #f8faf9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-link,
        .copy-button {
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .test-link {
            min-width: 84px;
            padding: 0 14px;
            border: 1px solid var(--primary);
            color: #ffffff;
            background: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .test-link:hover {
            border-color: var(--primary-hover);
            background: var(--primary-hover);
        }

        .copy-button {
            min-width: 52px;
            padding: 0 10px;
            flex: 0 0 auto;
            border: 1px solid var(--line);
            color: var(--text);
            background: var(--surface);
            font-size: 12px;
            font-weight: 700;
        }

        .copy-button:hover {
            border-color: #abb7b0;
            background: #f4f7f5;
        }

        .activity {
            margin-top: 24px;
            padding: 16px 18px;
            border-left: 4px solid var(--primary);
            background: var(--surface);
        }

        .activity-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .activity-value {
            display: block;
            overflow-wrap: anywhere;
            font-size: 13px;
            line-height: 1.55;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 20;
            min-width: 140px;
            padding: 11px 16px;
            border-radius: 6px;
            color: #ffffff;
            background: #202923;
            box-shadow: var(--shadow);
            text-align: center;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 8px);
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 820px) {
            .method {
                grid-template-columns: 40px minmax(0, 1fr) auto;
            }

            .scheme {
                grid-column: 2 / -1;
                grid-row: 2;
            }

            .actions {
                grid-column: 3;
                grid-row: 1;
            }
        }

        @media (max-width: 620px) {
            .topbar-inner,
            main {
                width: min(100% - 24px, 1080px);
            }

            .topbar-inner {
                min-height: 58px;
            }

            .brand span,
            .file-badge {
                display: none;
            }

            main {
                padding-top: 24px;
            }

            .page-heading h1 {
                font-size: 23px;
            }

            .environment {
                grid-template-columns: 1fr;
            }

            .environment-item + .environment-item {
                border-top: 1px solid var(--line);
                border-left: 0;
            }

            .section-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .method {
                grid-template-columns: 36px minmax(0, 1fr);
                gap: 10px;
                padding: 14px;
            }

            .method-index {
                width: 34px;
                height: 34px;
            }

            .scheme,
            .actions {
                grid-column: 1 / -1;
            }

            .scheme {
                grid-row: auto;
            }

            .actions {
                grid-row: auto;
                justify-content: flex-end;
            }

            .test-link {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">CW</div>
                <div>
                    <strong>OPPO 跳转测试</strong>
                    <span>创物岛 Android 商店适配</span>
                </div>
            </div>
            <span class="file-badge">单文件测试页</span>
        </div>
    </header>

    <main>
        <section class="page-heading">
            <h1>应用商店详情页调用</h1>
            <p>目标应用：创物岛 · 包名 com.chuang3d.app</p>
        </section>

        <section class="environment" aria-label="测试环境">
            <div class="environment-item">
                <span class="environment-label">设备识别</span>
                <span class="environment-value" id="device-result">检测中</span>
            </div>
            <div class="environment-item">
                <span class="environment-label">目标包名</span>
                <span class="environment-value">com.chuang3d.app</span>
            </div>
            <div class="environment-item">
                <span class="environment-label">User Agent</span>
                <span class="environment-value" id="user-agent"></span>
            </div>
        </section>

        <section aria-labelledby="methods-title">
            <div class="section-heading">
                <h2 id="methods-title">跳转方式</h2>
                <span id="method-count"></span>
            </div>
            <div class="method-list" id="method-list"></div>
        </section>

        <section class="activity" aria-live="polite">
            <span class="activity-label">最近调用</span>
            <span class="activity-value" id="last-action">尚未调用</span>
        </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
        const PACKAGE_NAME = 'com.chuang3d.app';
        const methods = [
            {
                name: 'OPPO 官方 Deeplink',
                tag: '官方文档 12050',
                tagClass: 'official',
                url: `market://details?id=${PACKAGE_NAME}&atd=false&m=website`
            },
            {
                name: '官方 Deeplink + 欢太 Intent',
                tag: '强制新版商店',
                tagClass: 'official',
                url: `intent://details?id=${PACKAGE_NAME}&atd=false&m=website#Intent;scheme=market;package=com.heytap.market;end`
            },
            {
                name: 'OPPO H5 详情页',
                tag: '官方网页',
                tagClass: 'official',
                url: 'https://app.cdo.oppomobile.com/home/detail?app_id=37438788'
            }
        ];

        const methodList = document.getElementById('method-list');
        const lastAction = document.getElementById('last-action');
        const toast = document.getElementById('toast');
        let toastTimer;

        function showToast(message) {
            window.clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.add('visible');
            toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 1600);
        }

        function recordAction(method) {
            const time = new Intl.DateTimeFormat('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).format(new Date());
            lastAction.textContent = `${time} · ${method.name} · ${method.url}`;
        }

        async function copyUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
            } catch (error) {
                const input = document.createElement('textarea');
                input.value = url;
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                input.remove();
            }
            showToast('链接已复制');
        }

        methods.forEach((method, index) => {
            const row = document.createElement('article');
            row.className = 'method';

            const number = document.createElement('div');
            number.className = 'method-index';
            number.textContent = String(index + 1).padStart(2, '0');

            const title = document.createElement('div');
            title.className = 'method-title';
            const titleText = document.createElement('strong');
            titleText.textContent = method.name;
            const tag = document.createElement('span');
            tag.className = `tag ${method.tagClass}`.trim();
            tag.textContent = method.tag;
            title.append(titleText, tag);

            const scheme = document.createElement('p');
            scheme.className = 'scheme';
            scheme.textContent = method.url;

            const actions = document.createElement('div');
            actions.className = 'actions';

            const testLink = document.createElement('a');
            testLink.className = 'test-link';
            testLink.href = method.url;
            testLink.textContent = '测试';
            testLink.addEventListener('click', () => recordAction(method));

            const copyButton = document.createElement('button');
            copyButton.className = 'copy-button';
            copyButton.type = 'button';
            copyButton.title = `复制 ${method.name} 链接`;
            copyButton.setAttribute('aria-label', `复制 ${method.name} 链接`);
            copyButton.textContent = '复制';
            copyButton.addEventListener('click', () => copyUrl(method.url));

            actions.append(testLink, copyButton);
            row.append(number, title, scheme, actions);
            methodList.appendChild(row);
        });

        const userAgent = navigator.userAgent || navigator.vendor || '';
        const isOppoFamily = /oppo|oneplus|realme|heytap/i.test(userAgent);
        const deviceResult = document.getElementById('device-result');
        deviceResult.textContent = isOppoFamily ? '已识别为 OPPO 系设备' : '未识别为 OPPO 系设备';
        deviceResult.className = `environment-value ${isOppoFamily ? 'detected' : 'not-detected'}`;
        document.getElementById('user-agent').textContent = userAgent;
        document.getElementById('method-count').textContent = `${methods.length} 种方式`;
    </script>
</body>
</html>
